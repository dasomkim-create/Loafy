<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;64px&quot;}}">
class Component extends DCLogic {
  state = { narrow: typeof window !== 'undefined' && innerWidth < 560 };
  componentDidMount() { this.onR = () => { const n = innerWidth < 560; if (n !== this.state.narrow) this.setState({ narrow: n }); }; addEventListener('resize', this.onR); }
  componentWillUnmount() { removeEventListener('resize', this.onR); }
  renderVals() { return { labelDisp: this.state.narrow ? 'none' : 'inline' }; }
}
</script>
